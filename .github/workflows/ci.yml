name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.node }}, ${{ matrix.homebridge }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
        homebridge: [1.8.0, 2.x]
        include:
          - node: 26.x
            homebridge: 2.x
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The quality job tests the exact lockfile; this job varies Homebridge.
      - name: Select Homebridge version
        env:
          HOMEBRIDGE_VERSION: ${{ matrix.homebridge }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.devDependencies.homebridge = process.env.HOMEBRIDGE_VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install
          pnpm list homebridge --depth 0
      - run: pnpm test
      - run: pnpm test:runtime

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm pack --dry-run
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14
