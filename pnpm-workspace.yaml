# Disabled so pnpm does not record its own version pin as a second YAML document
# in pnpm-lock.yaml: GitHub's dependency graph parses only the first document and
# would then miss every project dependency. pnpm/action-setup pins the pnpm version
# instead, reading the packageManager field in package.json.
pmOnFail: ignore

allowBuilds:
  '@serialport/bindings-cpp': true

overrides:
  brace-expansion: ^5.0.12

# braces <=3.0.3 has no patched release. It reaches the tree only through
# nodemon > chokidar@3 (dev-only, `pnpm watch`), and the patterns it expands
# come from our own nodemon.json. Remove once a fixed braces is published.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
